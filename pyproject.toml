[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "naif-gravity-mcp-doctor"
version = "0.3.1"
description = "NAIF Gravity MCP Doctor: free MCP server timeout, JSON-RPC and tools/list diagnostics with local Error Passport"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "NAIF Gravity"}]
keywords = ["NAIF Gravity", "MCP", "Model Context Protocol", "MCP server timeout", "tools/list", "JSON-RPC", "Streamable HTTP", "SSE", "coding agents", "MCP diagnostics", "Error Passport", "offline CLI"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://naifgravity.com/"
Repository = "https://github.com/naief9961-tech/naif-gravity-mcp-diagnostics"
Documentation = "https://github.com/naief9961-tech/naif-gravity-mcp-diagnostics/blob/main/docs/PACKAGE-DISTRIBUTION.md"
Issues = "https://github.com/naief9961-tech/naif-gravity-mcp-diagnostics/issues"
Changelog = "https://github.com/naief9961-tech/naif-gravity-mcp-diagnostics/releases"
"Free Troubleshooting Guides" = "https://naifgravity.com/discover"
"Arabic MCP Guides" = "https://naifgravity.com/ar/discover"


[project.scripts]
naif-mcp-doctor = "naif_gravity_mcp_doctor.error_passport:main"

[tool.setuptools]
packages = ["naif_gravity_mcp_doctor"]

[tool.setuptools.package-dir]
naif_gravity_mcp_doctor = "tools"
